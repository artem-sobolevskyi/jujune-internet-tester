name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write build version
        shell: bash
        run: |
          printf 'VERSION = "1.0.%s"\nCOMMIT = "%s"\n' "${{ github.run_number }}" "${{ github.sha }}" > jujune/_buildinfo.py

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Make icon
        run: |
          python -c "from PIL import Image; im=Image.open('assets/jujune_icon.png').convert('RGBA'); im.save('assets/jujune.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build EXE
        run: pyinstaller --noconfirm jujune.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Jujune
          path: dist/Jujune.exe
          if-no-files-found: error

      - name: Publish source-repo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jujune 1.0.${{ github.run_number }}
          files: dist/Jujune.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish public download
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          repository: artem-24paybase/jujune-releases
          tag_name: v1.0.${{ github.run_number }}
          name: Jujune 1.0.${{ github.run_number }}
          files: dist/Jujune.exe
          make_latest: true
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
