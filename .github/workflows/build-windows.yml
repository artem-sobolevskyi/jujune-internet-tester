name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Make icon
        run: |
          python -c "from PIL import Image; im=Image.open('assets/jujune_icon.png').convert('RGBA'); im.save('assets/jujune.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build EXE
        run: pyinstaller --noconfirm jujune.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Jujune
          path: dist/Jujune.exe
          if-no-files-found: error
